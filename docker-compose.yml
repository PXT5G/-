version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: bananaos-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - bananaos-mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: bananaos
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bananaos-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/bananaos
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-16-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-min-16-chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bananaos-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  bananaos-mongo-data:
